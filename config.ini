[overlay]
; units=frames or units=time. on_* is how long the strobe is drawn, off_* how long
; the game shows through. refresh_hz is a number, or auto to follow the monitor.
units=frames
on_frames=100
off_frames=100
on_ms=100
off_ms=100
refresh_hz=auto

[appearance]
; fill=color or fill=image. color is RRGGBB, image is a path relative to the exe.
fill=color
color=000000
image=

[mask]
; White in the mask draws the strobe, black leaves the game visible.
enabled=0
file=
invert=0

[display]
; Device name such as \\.\DISPLAY1. Empty means the primary monitor.
monitor=

[hotkeys]
; Global hotkeys. toggle starts and stops the strobe, panic quits, showgui opens
; the menu.
toggle=CTRL+SHIFT+3
panic=CTRL+SHIFT+5
showgui=CTRL+SHIFT+1
