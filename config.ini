[overlay]
; Strobe durations and refresh settings.  Durations are expressed in frames.
on_frames=100
off_frames=100
refresh_hz=400

[hotkeys]
; Global hotkeys.  Use CTRL+SHIFT+3 to toggle the overlay, CTRL+SHIFT+5 to quit,
; and CTRL+SHIFT+1 to bring the GUI to the foreground.
toggle=CTRL+SHIFT+3
panic=CTRL+SHIFT+5
showgui=CTRL+SHIFT+1