[overlay]
; Strobe durations and refresh settings.  Durations are expressed in frames.
on_frames=50
off_frames=50
refresh_hz=400

[hotkeys]
; Global hotkeys.  Use CTRL+SHIFT+3 to toggle the overlay, CTRL+SHIFT+0 to quit,
; and CTRL+SHIFT+9 to bring the GUI to the foreground.
toggle=CTRL+SHIFT+3
panic=CTRL+SHIFT+0
showgui=CTRL+SHIFT+B